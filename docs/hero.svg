  </defs>

  
  <rect width="1280" height="420" fill="url(#bg)"></rect>
  <rect width="1280" height="420" fill="url(#dots)"></rect>

  
  <g font-family="ui-monospace, &#39;JetBrains Mono&#39;, SFMono-Regular, Menlo, monospace" fill="#F5F7F2">
    
