<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="WorkSearch — an AI workspace for the modern job hunt">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B4332"></stop>
      <stop offset="0.38" stop-color="#2D6A4F"></stop>
      <stop offset="0.72" stop-color="#40916C"></stop>
      <stop offset="1" stop-color="#95D5B2"></stop>
